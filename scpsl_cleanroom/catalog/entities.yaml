- id: Scp079
  name: SCP-079
  category: role.scp
  tag: "(?i)079|computer"
  templates: [scp_role]
  questions:
    - id: energy_regen
      ask: 에너지 회복 공식 (레벨별)
      analysis: {type: formula, extract: time, y_field: energy, models: growth, x: "시간 (s)", y: "에너지"}
    - id: experience
      ask: 경험치/레벨 규칙
      analysis: {type: manual}

- id: scp018
  name: SCP-018
  category: item.throwable
  tag: "(?i)018|ball"
  templates: [throwable]
  questions:
    - id: speed_per_bounce
      ask: 튕길 때마다 속도가 변하는 공식
      analysis: {type: formula, extract: bounce, id: scp018, models: growth, x: "튕긴 횟수", y: "속도 (m/s)"}
      record: "닫힌 방에서 018을 던지고 멈출 때까지 공 위치 기록 (id=scp018, 30Hz 이상) x5"
      min_n: 15
    - id: damage_vs_speed
      ask: 공 속도에 따른 피해 공식
      analysis: {type: formula, extract: fields, x_field: speed, y_field: damage, event: hit, tag: scp018, models: growth, x: "속도 (m/s)", y: "피해"}
      record: "공에 맞을 때 hit(tag=scp018, speed, damage 또는 hp)"
    - id: lifetime
      ask: 던진 뒤 사라질 때까지 시간
      analysis: {type: latency, from: throw, to: despawn, tag: scp018}

