# Starting catalog. Names only - no values. Verify against 10.2.2 and extend freely:
# add entities, add questions, or remove templates that do not apply.
#   id:        used in telemetry selectors (role / tag)
#   tag:       regex for matching asset names (sounds, animations, animators)
#   templates: question templates from _templates.yaml
#   questions: extra entity-specific questions

- {id: ClassD, name: Class-D, category: role.human, tag: "(?i)classd|class_d|dboy", templates: [human_role]}
- {id: Scientist, name: Scientist, category: role.human, tag: "(?i)scientist", templates: [human_role]}
- {id: FacilityGuard, name: Facility Guard, category: role.human, tag: "(?i)guard", templates: [human_role]}
- {id: NtfCadet, name: NTF Cadet, category: role.human, tag: "(?i)ntf|mtf", templates: [human_role]}
- {id: NtfLieutenant, name: NTF Lieutenant, category: role.human, tag: "(?i)ntf|mtf", templates: [human_role]}
- {id: NtfCommander, name: NTF Commander, category: role.human, tag: "(?i)ntf|mtf", templates: [human_role]}
- {id: ChaosInsurgency, name: Chaos Insurgency, category: role.human, tag: "(?i)chaos|ci_", templates: [human_role]}

- id: Scp173
  name: SCP-173
  category: role.scp
  tag: "(?i)173"
  templates: [scp_role]
  questions:
    - id: blink
      ask: 블링크(시선 해제 시 이동) 규칙 - 이동 거리, 쿨다운
      analysis: {type: interval, event: blink, role: Scp173}
      record: "아무도 안 볼 때 연속 이동 (blink 이벤트)"
    - id: tantrum
      ask: 탄트럼(오물) 지속시간/쿨다운
      analysis: {type: duration, event: tantrum}

- id: Scp096
  name: SCP-096
  category: role.scp
  tag: "(?i)096"
  templates: [scp_role]
  questions:
    - id: enrage_sequence
      ask: 얼굴을 본 뒤 분노까지의 타임라인 (모션, 사운드, 상태)
      analysis: {type: sequence, trigger: face_seen, window: 30}
      record: "얼굴 보기(face_seen) 순간부터 annotate + 사운드 매칭"
    - id: enrage_charge_time
      ask: 분노 준비(울부짖음) 시간
      analysis: {type: duration, event: enrage_windup}
    - id: rage_duration
      ask: 분노 지속 시간과 연장 조건
      analysis: {type: duration, event: rage}
    - id: rage_speed
      ask: 분노 상태 이동 속도
      analysis: {type: speed, role: Scp096, state: enraged}
    - id: gate_force
      ask: 게이트 강제 개방 타임라인 (전용 모션/사운드, 게이트 상태)
      analysis: {type: sequence, trigger: gate_force_start, window: 15}
      record: "분노 상태로 닫힌 게이트에 접근 → 녹화 → annotate(gate_force_start, anim, gate 상태) + sounds match"
    - id: gate_force_conditions
      ask: 강제 개방 가능 조건 (상태, 게이트 종류)
      analysis: {type: context, event: gate_force_start}
    - id: door_pry
      ask: 일반 문 파괴/개방 방식
      analysis: {type: sequence, trigger: door_break, window: 5}

- id: Scp049
  name: SCP-049
  category: role.scp
  tag: "(?i)049(?!_?2)"
  templates: [scp_role]
  questions:
    - id: revive_time
      ask: 부활 소요 시간
      analysis: {type: duration, event: revive}
    - id: attack_cooldown
      ask: 공격 쿨다운
      analysis: {type: interval, event: attack, role: Scp049}

- {id: Scp0492, name: SCP-049-2, category: role.scp, tag: "(?i)049_?2|zombie", templates: [scp_role]}

- id: Scp106
  name: SCP-106
  category: role.scp
  tag: "(?i)106|larry|pocket"
  templates: [scp_role]
  questions:
    - id: pocket_damage
      ask: 주머니 차원 지속 피해 공식
      analysis: {type: formula, extract: time, y_field: hp, start_event: pocket_enter, models: growth, x: "진입 후 시간 (s)", y: "체력"}
    - id: portal_sequence
      ask: 포탈 생성/이동 타임라인
      analysis: {type: sequence, trigger: portal_use, window: 10}

